# dsh-danmaku —— DSH bundle patch
#
# 挂载声明：把 host 半边插进当前 profile 的配置树。
# 开发期安装：dsh plugin --profile <profile> add link:<项目>/plugin
#
# 注意：前端那一半不在这里声明。它是一份普通脚本，由 host 半边注入 DSH 页面，
# 同时被 dsh-desktop-overlay 的白名单引到桌面 overlay 页面里（见那份插件的 WHITELIST）。

- insert:
    - id: dsh-danmaku
      name: dsh-danmaku
